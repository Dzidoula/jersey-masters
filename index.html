<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jersey Masters — Portez les couleurs</title>
  <meta name="description" content="Boutique de maillots de football africains : Maroc, Sénégal, Tunisie, Cap-Vert, Nigeria, Ghana, Afrique du Sud, Cameroun." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f26a1b'/><text x='16' y='22' font-size='14' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'>JM</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="stage">
    <header class="topbar">
      <a href="#" class="brand" aria-label="Jersey Masters — accueil"><span class="brand-mark">JM</span><span>Jersey Masters</span></a>
      <nav class="pill" aria-label="Navigation principale">
        <a href="#" data-action="open-all">Maillot nations</a>
        <a href="#" data-action="open-all">Tous les produits</a>
        <a href="#about" data-action="about">À propos</a>
        <a href="#contact" data-action="contact">Contact</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" id="cartBtn" aria-label="Ouvrir le panier">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
          <span class="badge" id="cartCount" hidden>0</span>
        </button>
        <button class="icon-btn" id="favBtn" aria-label="Voir mes favoris" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
          <span class="badge" id="favCount" hidden>0</span>
        </button>
      </div>
    </header>

    <section class="hero" aria-live="polite">
      <div class="copy" id="copy">
        <div class="arrows">
          <button class="round" id="prev" aria-label="Maillot précédent">‹</button>
          <button class="round" id="next" aria-label="Maillot suivant">›</button>
        </div>
        <p class="country" id="country"></p>
        <h1 id="title"></h1>
        <p class="story" id="story"></p>
        <div class="cta">
          <button class="btn-add" id="addBtn">Ajouter au panier
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
          </button>
          <button class="round heart" id="heartBtn" aria-label="Ajouter aux favoris" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
          </button>
        </div>
      </div>

      <div class="visual">
        <div class="glow" aria-hidden="true"></div>
        <div class="jersey" id="jersey" role="img"></div>
        <p class="caption" id="caption"></p>
      </div>

      <div class="buy" id="buy">
        <p class="price"><span id="price"></span></p>
        <p class="old" id="old"></p>
        <p class="sizes-label" id="sizesLabel">Choisissez votre taille :</p>
        <div class="sizes" role="radiogroup" aria-labelledby="sizesLabel" id="sizes"></div>
      </div>
    </section>

    <footer class="foot">
      <div class="socials">
        <a href="#" aria-label="Instagram">IG</a><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="X">X</a><a href="#" aria-label="TikTok">TT</a>
      </div>
      <button class="next-thumb" id="nextThumb" aria-label="Aller au maillot suivant"></button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <aside class="drawer" id="drawer" aria-label="Panier" aria-hidden="true">
    <div class="drawer-head"><h2>Votre Panier</h2><button class="x" id="closeCart" aria-label="Fermer le panier">✕</button></div>
    <ul class="items" id="items"></ul>
    <div class="drawer-foot">
      <p class="total"><span>Total</span><strong id="total">0 FCFA</strong></p>
      <button class="btn-checkout" id="checkout">Valider la commande</button>
    </div>
  </aside>

  <div class="overlay" id="overlay" hidden></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card">
      <div class="modal-head"><h2 id="modalTitle">Tous nos maillots africains</h2><button class="x" id="closeModal" aria-label="Fermer">✕</button></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="modal" id="info" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden>
    <div class="modal-card small">
      <div class="modal-head"><h2 id="infoTitle"></h2><button class="x" id="closeInfo" aria-label="Fermer">✕</button></div>
      <p id="infoText" class="info-text"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
